name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js (Astro 6 requires >=22.12)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Materialize Astro ambient types
        run: bunx astro sync
        working-directory: packages/frontend

      - name: Lint (biome)
        run: bun run lint

      - name: Typecheck (all workspaces)
        run: bun --filter '*' typecheck

      - name: Test (backend unit)
        run: bun --filter @effect-redacted/backend test:unit

      - name: Test (backend integration)
        run: bun --filter @effect-redacted/backend test:integration
